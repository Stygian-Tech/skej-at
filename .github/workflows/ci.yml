name: CI

# Railway deploys linked Git revisions. GitHub Actions verifies source changes
# and never writes to hosted infrastructure.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          GITHUB_EVENT_PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-detect-changes.sh

  ci-js:
    name: Web and lexicon checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.14"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Run JS CI
        run: bash scripts/ci-js.sh
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  ci-swift:
    name: Gateway Swift checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Swift version
        run: swift --version

      - name: Run gateway CI
        run: bash scripts/ci-swift.sh

  docker-gateway:
    name: Gateway Docker build
    needs: [changes]
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build gateway image
        run: docker build -f services/skej-api/Dockerfile services/skej-api

  required:
    name: CI — Required
    needs: [changes, ci-js, ci-swift, docker-gateway]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          JS_RESULT: ${{ needs.ci-js.result }}
          SWIFT_RESULT: ${{ needs.ci-swift.result }}
          DOCKER_RESULT: ${{ needs.docker-gateway.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$JS_RESULT" = success
          test "$SWIFT_RESULT" = success
          test "$DOCKER_RESULT" = success || test "$DOCKER_RESULT" = skipped
